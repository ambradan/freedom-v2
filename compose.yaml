services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freedom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: freedom
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freedom"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped

  litellm:
    restart: unless-stopped
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-v1.83.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"

  app:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PG_DSN: postgresql://freedom:${POSTGRES_PASSWORD}@postgres:5432/freedom
      QDRANT_URL: http://qdrant:6333
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SITE_REPO: ${SITE_REPO:-github.com/ambradan/freedom-interface.git}
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      - ./PROFILE.md:/app/PROFILE.md:ro
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_storage:
