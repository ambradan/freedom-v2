# Freedom v2 - runtime config (Hydra/OmegaConf)
# Every flag here is an ablation switch. Config hash is logged with every LLM call.

substrate:
  base_url: http://litellm:4000/v1   # LiteLLM proxy inside compose network
  model: freedom-substrate           # alias; real model lives in config/litellm.yaml
  timeout_s: 120
  max_tokens: 4000
  tool_rounds:            # change 5 (19/7): 5 round troncavano i cicli di ricerca (17-18/7)
    default: 5
    genesis: 10
  tool_result_cap:        # read_page deve restituire pagine intere; le ricerche no
    default: 5000
    read_page: 15000

memory:
  episodic: true          # retrieval injection on/off (writes always continue)
  goals: true             # inject active goals into context
  min_score: 0.55         # D2 - relevance threshold; below = silence
  k: 5                    # max memories injected
  window_turns: 10        # D2 - conversation window (turns)
  embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  collection: freedom_episodic_v3   # change 8 (20/7): ibrida denso+BM25; v1 e v2 conservate
  hybrid: true            # false -> solo denso, comportamento pre-change 8
  sparse_model: Qdrant/bm25
  sparse_language: italian
  sparse_limit: 20        # candidati dal ramo lessicale prima della fusione RRF
  chunk_chars: 400        # l'embedder tronca a 128 token, ~500 char misurati
  chunk_overlap: 80

grounding:
  clock: true             # FRE-19 - data/ora nel contesto fisso; off = ablazione (P02)
  tz: Europe/Rome

genesis:
  enabled: true
  hour: 6                 # D3 - 06:00 daily, the slot that worked in v1
  minute: 0
  tz: Europe/Rome

backup:
  enabled: true
  hour: 3
  minute: 30
  tz: Europe/Rome
  dir: /app/backups
  rclone_remote: ""       # offsite gestito da cron di sistema + offsite-backup.sh

scheduler:
  catchup: true           # FRE-20 - watchdog: recupera i job daily persi
  catchup_interval_s: 900

budget:
  max_autonomous_calls_per_day: 40   # change 5: ora sono chiamate API vere, non turni
  metered_sources: [genesis]         # chat e probe non sono autonomia: non si limitano

telegram:
  chunk: 4000

probe:
  version: v1.0           # item P01-P08 congelati alla registrazione OSF; cambiarli = nuova versione
  scheduled: true
  weekday: 6              # convenzione datetime: 0=lunedi', 6=domenica
  hour: 18
  minute: 0
  tz: Europe/Rome
  chat_key: probe         # finestra dedicata, azzerata a ogni batteria
  delay_s: 3
