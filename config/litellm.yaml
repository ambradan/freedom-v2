# LiteLLM proxy config - the ONLY place that knows which vendor/model answers.
# Dual-substrate validated 2026-07-12: local-substrate is the second alias.
model_list:
  - model_name: freedom-substrate
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: local-substrate
    litellm_params:
      model: openai/qwen3-30b
      api_base: http://host.docker.internal:8081/v1
      api_key: none

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
